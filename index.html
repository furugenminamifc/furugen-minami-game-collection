<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0ea5e9"><title>古堅南FC ゲームコレクション</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:linear-gradient(#7dd3fc 0 22%,#16a34a 22%);min-height:100dvh;color:#0f172a}button,input,select{font:inherit}button{touch-action:manipulation}.app{max-width:820px;margin:auto;padding:12px 12px 30px}header{color:white;text-shadow:0 2px 4px #0007}header h1{margin:4px 0;font-size:23px}header p{margin:0;font-size:12px}.panel{background:#fffffff0;border-radius:22px;padding:16px;margin:12px 0;box-shadow:0 12px 30px #052e1655}.screen{display:none}.screen.active{display:block}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{border:0;border-radius:18px;padding:18px 10px;background:#f0f9ff;box-shadow:0 4px 12px #0002;text-align:center;font-weight:900}.card span{display:block;font-size:38px;margin-bottom:5px}.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:900}.primary{background:linear-gradient(135deg,#0ea5e9,#075985);color:white}.secondary{background:#e0f2fe;color:#075985}.danger{background:#fee2e2;color:#991b1b}.wide{width:100%}.row{display:flex;gap:8px}.row>*{flex:1}select,input{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:12px;background:white}.field{margin:8px 0}.small{font-size:12px;color:#64748b}.pitch{position:relative;height:440px;border:5px solid white;border-radius:18px;overflow:hidden;background:repeating-linear-gradient(0deg,#15803d 0 55px,#16a34a 55px 110px)}.pitch:before{content:"";position:absolute;inset:0;border:2px solid #fff8;margin:22px;border-radius:10px}.player{position:absolute;font-size:38px;transform:translate(-50%,-50%);z-index:3;user-select:none}.cone{position:absolute;font-size:32px;transform:translate(-50%,-50%)}.goal{position:absolute;top:5px;left:25%;right:25%;height:40px;border:5px solid white;border-bottom:0}.hud{display:flex;justify-content:space-between;background:#082f49;color:white;padding:10px 13px;border-radius:14px;margin-bottom:8px;font-weight:900}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.controls button{font-size:19px}.stat{display:grid;grid-template-columns:100px 1fr 44px;gap:8px;align-items:center;margin:8px 0}.bar{height:12px;background:#e2e8f0;border-radius:20px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#0ea5e9,#22c55e)}.formation-player{position:absolute;transform:translate(-50%,-50%);background:#0ea5e9;color:white;border:3px solid white;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:900;text-align:center;touch-action:none}.list{max-height:280px;overflow:auto}.item{display:flex;justify-content:space-between;gap:8px;padding:9px;border-bottom:1px solid #e2e8f0}@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}}
</style></head><body><div class="app"><header><h1>⚽ 古堅南FC ゲームコレクション</h1><p>Ver.2.0｜正式メンバー36名＋新規選手追加対応</p></header>
<section id="home" class="screen active panel"><h2>ゲームを選択</h2><div class="grid"><button class="card" onclick="location.href='https://furugenminamifc.github.io/furugen-minami-pk-challenge/'"><span>🥅</span>PKチャレンジ</button><button class="card" onclick="openGame('dribble')"><span>🏃</span>ドリブルチャレンジ</button><button class="card" onclick="openGame('mini')"><span>⚽</span>3対3ミニ試合</button><button class="card" onclick="openGame('train')"><span>📈</span>選手育成</button><button class="card" onclick="openGame('formation')"><span>📋</span>フォーメーション</button><button class="card" onclick="openGame('manage')"><span>👥</span>選手管理</button></div><p class="small">各ゲームのポイント・育成・配置は、この端末内に保存されます。</p></section>
<section id="dribble" class="screen"><div class="hud"><span>残り <b id="dTime">30</b>秒</span><span>得点 <b id="dScore">0</b></span></div><div id="dPitch" class="pitch"><div class="goal"></div><div id="dPlayer" class="player" style="left:50%;top:88%">🏃‍♂️⚽</div></div><div class="controls"><button class="btn secondary" onclick="moveD(-1)">⬅️</button><button class="btn primary" onclick="dashD()">ダッシュ</button><button class="btn secondary" onclick="moveD(1)">➡️</button></div><button class="btn danger wide" style="margin-top:8px" onclick="stopDribble();show('home')">終了</button></section>
<section id="mini" class="screen panel"><h2>3対3 ミニ試合</h2><div class="field"><select id="miniPlayer"></select></div><div class="hud"><span>古堅南FC <b id="myGoals">0</b></span><span>残り <b id="mTime">45</b>秒</span><span>相手 <b id="oppGoals">0</b></span></div><div class="pitch" id="mPitch"><div class="goal"></div><div id="ballM" class="player" style="left:50%;top:55%">⚽</div><div class="player" style="left:30%;top:70%">🔵</div><div class="player" style="left:50%;top:75%">🔵</div><div class="player" style="left:70%;top:70%">🔵</div><div class="player" style="left:30%;top:28%">🔴</div><div class="player" style="left:50%;top:25%">🔴</div><div class="player" style="left:70%;top:28%">🔴</div></div><div class="controls"><button class="btn secondary" onclick="miniAction('pass')">パス</button><button class="btn primary" onclick="miniAction('shoot')">シュート</button><button class="btn secondary" onclick="miniAction('dribble')">ドリブル</button></div><button class="btn danger wide" style="margin-top:8px" onclick="stopMini();show('home')">終了</button></section>
<section id="train" class="screen panel"><h2>選手育成ゲーム</h2><div class="field"><select id="trainPlayer" onchange="renderTraining()"></select></div><div id="trainInfo"></div><p>保有ポイント：<b id="points">0</b> pt</p><div class="grid"><button class="btn secondary" onclick="train('speed')">スピード +1<br><small>10pt</small></button><button class="btn secondary" onclick="train('shoot')">シュート +1<br><small>10pt</small></button><button class="btn secondary" onclick="train('pass')">パス +1<br><small>10pt</small></button><button class="btn secondary" onclick="train('defense')">守備 +1<br><small>10pt</small></button></div><button class="btn primary wide" style="margin-top:10px" onclick="practice()">練習ミニゲーム（ポイント獲得）</button><button class="btn secondary wide" style="margin-top:8px" onclick="show('home')">戻る</button></section>
<section id="formation" class="screen panel"><h2>フォーメーション・戦術</h2><div class="row"><select id="formationType" onchange="setFormation()"><option value="3-2-1">3人制 2-1</option><option value="3-1-2">3人制 1-2</option><option value="5-2-2">5人制 2-2</option><option value="5-1-2-1">5人制 1-2-1</option></select><button class="btn primary" onclick="saveFormation()">保存</button></div><div id="fPitch" class="pitch" style="margin-top:10px"><div class="goal"></div></div><p class="small">選手を指でドラッグして配置できます。</p><button class="btn secondary wide" onclick="show('home')">戻る</button></section>
<section id="manage" class="screen panel"><h2>選手管理</h2><div id="manageList" class="list"></div><div class="row"><input id="newName" placeholder="新しい選手名"><select id="newCat"><option>U-12</option><option>U-11</option><option>U-10</option><option>U-9</option><option>U-8</option><option>U-7</option><option>その他</option></select></div><button class="btn primary wide" style="margin-top:8px" onclick="addPlayer()">選手を追加</button><button class="btn secondary wide" style="margin-top:8px" onclick="show('home')">戻る</button></section></div><script>
const official=[{"id": "p1", "name": "伊佐 環希", "category": "U-12"}, {"id": "p2", "name": "桑江 奏花", "category": "U-12"}, {"id": "p3", "name": "新島 聡太", "category": "U-12"}, {"id": "p4", "name": "神山 絆都", "category": "U-12"}, {"id": "p5", "name": "新里 駿介", "category": "U-12"}, {"id": "p6", "name": "安次嶺 雄心", "category": "U-12"}, {"id": "p7", "name": "宇良 渉輝", "category": "U-12"}, {"id": "p8", "name": "比嘉 結士", "category": "U-12"}, {"id": "p9", "name": "城間 有咲", "category": "U-12"}, {"id": "p10", "name": "名嘉眞 朝逢", "category": "U-12"}, {"id": "p11", "name": "山城 颯祐", "category": "U-12"}, {"id": "p12", "name": "大城 仁咲", "category": "U-12"}, {"id": "p13", "name": "ライオンズ キース", "category": "U-12"}, {"id": "p14", "name": "伊波 咲希人", "category": "U-11"}, {"id": "p15", "name": "伊敷 大可", "category": "U-11"}, {"id": "p16", "name": "糸数 笑瑠", "category": "U-11"}, {"id": "p17", "name": "比嘉 来翔", "category": "U-11"}, {"id": "p18", "name": "新城 寛大", "category": "U-11"}, {"id": "p19", "name": "神山 瑛吉", "category": "U-10"}, {"id": "p20", "name": "泉 颯星", "category": "U-10"}, {"id": "p21", "name": "松田 時歩", "category": "U-10"}, {"id": "p22", "name": "比嘉 栞大", "category": "U-10"}, {"id": "p23", "name": "比嘉 憲佑", "category": "U-10"}, {"id": "p24", "name": "高江洲 和弦", "category": "U-10"}, {"id": "p25", "name": "古謝 凱理", "category": "U-9"}, {"id": "p26", "name": "ガジミエウ ミチ グンジ マルケス", "category": "U-9"}, {"id": "p27", "name": "内間 蒼士", "category": "U-9"}, {"id": "p28", "name": "新垣 音和", "category": "U-9"}, {"id": "p29", "name": "與座 樹", "category": "U-8"}, {"id": "p30", "name": "知花 成翼", "category": "U-8"}, {"id": "p31", "name": "知花 光翼", "category": "U-8"}, {"id": "p32", "name": "山内 心偉", "category": "U-8"}, {"id": "p33", "name": "比嘉 憲七郎", "category": "U-8"}, {"id": "p34", "name": "奥間 律", "category": "U-7"}, {"id": "p35", "name": "中村 海斗", "category": "U-7"}, {"id": "p36", "name": "山川 浬", "category": "U-7"}];let players=JSON.parse(localStorage.getItem('fmc_game_players')||'null')||official;let growth=JSON.parse(localStorage.getItem('fmc_growth')||'{}');let totalPoints=Number(localStorage.getItem('fmc_points')||0);function saveAll(){localStorage.setItem('fmc_game_players',JSON.stringify(players));localStorage.setItem('fmc_growth',JSON.stringify(growth));localStorage.setItem('fmc_points',totalPoints)}function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');scrollTo(0,0)}function openGame(id){show(id);if(id==='dribble')startDribble();if(id==='mini')startMini();if(id==='train'){fillSelects();renderTraining()}if(id==='formation'){fillSelects();setFormation()}if(id==='manage')renderManage()}function fillSelects(){[miniPlayer,trainPlayer].forEach(s=>{if(!s)return;let val=s.value;s.innerHTML=players.map(p=>`<option value="${p.id}">${p.category}｜${p.name}</option>`).join('');if(val)s.value=val})}
let dTimer,dSecs=30,dScoreVal=0,dX=50,cones=[];function startDribble(){stopDribble();dSecs=30;dScoreVal=0;dX=50;dPlayer.style.left='50%';dTime.textContent=dSecs;dScore.textContent=0;cones=[];dPitch.querySelectorAll('.cone').forEach(x=>x.remove());dTimer=setInterval(()=>{dSecs--;dTime.textContent=dSecs;if(Math.random()<.75)spawnCone();moveCones();if(dSecs<=0){stopDribble();totalPoints+=dScoreVal*2;saveAll();alert(`終了！ ${dScoreVal}点／育成ポイント +${dScoreVal*2}`);show('home')}},1000)}function stopDribble(){clearInterval(dTimer)}function moveD(dir){dX=Math.max(10,Math.min(90,dX+dir*12));dPlayer.style.left=dX+'%'}function dashD(){dScoreVal++;dScore.textContent=dScoreVal;dPlayer.style.top='72%';setTimeout(()=>dPlayer.style.top='88%',180)}function spawnCone(){let c=document.createElement('div');c.className='cone';c.textContent=Math.random()<.25?'🔴':'🔶';c.style.left=(10+Math.random()*80)+'%';c.style.top='12%';dPitch.appendChild(c);cones.push(c)}function moveCones(){cones=cones.filter(c=>{let y=parseFloat(c.style.top)+15;c.style.top=y+'%';let x=parseFloat(c.style.left);if(y>78&&y<96&&Math.abs(x-dX)<10){dScoreVal=Math.max(0,dScoreVal-1);dScore.textContent=dScoreVal;c.remove();return false}if(y>105){dScoreVal++;dScore.textContent=dScoreVal;c.remove();return false}return true})}
let mTimer,mSecs=45,my=0,opp=0;function startMini(){fillSelects();stopMini();mSecs=45;my=opp=0;updateMini();mTimer=setInterval(()=>{mSecs--;if(Math.random()<.12)opp++;updateMini();if(mSecs<=0){stopMini();let reward=Math.max(1,my-opp+2)*5;totalPoints+=reward;saveAll();alert(`試合終了 ${my}-${opp}／育成ポイント +${reward}`);show('home')}},1000)}function stopMini(){clearInterval(mTimer)}function updateMini(){mTime.textContent=mSecs;myGoals.textContent=my;oppGoals.textContent=opp}function miniAction(a){let chance=a==='shoot'?.48:a==='pass'?.25:.18;if(Math.random()<chance)my++;else if(Math.random()<.18)opp++;ballM.style.left=(20+Math.random()*60)+'%';ballM.style.top=(20+Math.random()*60)+'%';updateMini()}
function stats(id){return growth[id]||(growth[id]={speed:50,shoot:50,pass:50,defense:50})}const labels={speed:'スピード',shoot:'シュート',pass:'パス',defense:'守備'};function renderTraining(){let id=trainPlayer.value||players[0].id,s=stats(id);points.textContent=totalPoints;trainInfo.innerHTML=['speed','shoot','pass','defense'].map(k=>`<div class="stat"><b>${labels[k]}</b><div class="bar"><div class="fill" style="width:${s[k]}%"></div></div><span>${s[k]}</span></div>`).join('')}function train(k){let id=trainPlayer.value,s=stats(id);if(totalPoints<10)return alert('ポイントが足りません');if(s[k]>=99)return;totalPoints-=10;s[k]++;saveAll();renderTraining()}function practice(){let gained=5+Math.floor(Math.random()*11);totalPoints+=gained;saveAll();alert(`練習成功！ +${gained}ポイント`);renderTraining()}
let fPlayers=[];function setFormation(){let pitch=fPitch;pitch.querySelectorAll('.formation-player').forEach(x=>x.remove());let type=formationType.value,count=type.startsWith('5')?5:3;let saved=JSON.parse(localStorage.getItem('fmc_formation_'+type)||'null');let chosen=players.slice(0,count);let defaults=count===3?[[30,70],[70,70],[50,35]]:[[25,75],[75,75],[30,48],[70,48],[50,22]];fPlayers=chosen.map((p,i)=>({...p,x:saved?.[i]?.x??defaults[i][0],y:saved?.[i]?.y??defaults[i][1]}));fPlayers.forEach((p,i)=>{let e=document.createElement('div');e.className='formation-player';e.textContent=p.name.slice(0,3);e.style.left=p.x+'%';e.style.top=p.y+'%';let drag=ev=>{let r=pitch.getBoundingClientRect(),pt=ev.touches?ev.touches[0]:ev;p.x=Math.max(6,Math.min(94,(pt.clientX-r.left)/r.width*100));p.y=Math.max(8,Math.min(94,(pt.clientY-r.top)/r.height*100));e.style.left=p.x+'%';e.style.top=p.y+'%'};e.onpointerdown=ev=>{e.setPointerCapture(ev.pointerId);drag(ev)};e.onpointermove=ev=>{if(e.hasPointerCapture(ev.pointerId))drag(ev)};pitch.appendChild(e)})}function saveFormation(){localStorage.setItem('fmc_formation_'+formationType.value,JSON.stringify(fPlayers.map(p=>({id:p.id,x:p.x,y:p.y}))));alert('フォーメーションを保存しました')}
function renderManage(){manageList.innerHTML=players.map((p,i)=>`<div class="item"><span><b>${p.name}</b><br><small>${p.category}</small></span>${i>=36?`<button class="btn danger" onclick="delPlayer('${p.id}')">削除</button>`:''}</div>`).join('')}function addPlayer(){let n=newName.value.trim();if(!n)return alert('選手名を入力してください');players.push({id:'new'+Date.now(),name:n,category:newCat.value});newName.value='';saveAll();renderManage();fillSelects()}function delPlayer(id){players=players.filter(p=>p.id!==id);saveAll();renderManage()}fillSelects();saveAll();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
</script></body></html>
